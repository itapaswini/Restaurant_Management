<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Restaurant Dashboard</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

/* 🌞 Light Mode (default) */
body {
    background: #F9F5FF;
    transition: 0.4s;
}

/* 🌙 Dark Mode */
body.dark {
    background: #1E1E2F;
    color: #eee;
}

/* 🔥 Header */
header {
    background: #8E44AD;
    padding: 30px;
    text-align: center;
    color: white;
    position: relative;
}

/* 🌙 Toggle Button */
.toggle-btn {
    position: absolute;
    right: 20px;
    top: 25px;
    padding: 8px 15px;
    border: none;
    border-radius: 20px;
    background: white;
    cursor: pointer;
    font-weight: bold;
}

/* 💎 Cards Container */
main {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 35px;
    margin: 60px;
}

/* 🌈 Animated Gradient Cards */
.card {
    width: 260px;
    height: 180px;
    border-radius: 15px;
    text-align: center;
    padding: 20px;
    text-decoration: none;
    color: #333;

    display: flex;
    flex-direction: column;
    justify-content: center;

    background: linear-gradient(270deg, #EDE7F6, #D1C4E9, #F3E5F5);
    background-size: 600% 600%;
    animation: gradientMove 6s ease infinite;

    box-shadow: 0 6px 20px rgba(0,0,0,0.1);
    transition: 0.4s;

    opacity: 0;
    transform: translateY(30px);
    animation: fadeUp 0.6s forwards;
}

/* 🌙 Dark mode cards */
body.dark .card {
    color: white;
   background: linear-gradient(270deg, #1a0033, #3b0a75, #240046, #2d1b69);
}

/* 🎬 Animations */
@keyframes gradientMove {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

@keyframes fadeUp {
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* Delay animation */
.card:nth-child(1){animation-delay:0.1s;}
.card:nth-child(2){animation-delay:0.2s;}
.card:nth-child(3){animation-delay:0.3s;}
.card:nth-child(4){animation-delay:0.4s;}
.card:nth-child(5){animation-delay:0.5s;}

/* Hover effect */
.card:hover {
    transform: scale(1.07) translateY(-10px);
    box-shadow: 0 12px 30px rgba(0,0,0,0.3);
}

/* Text */
.card h2 {
    margin-bottom: 10px;
}

.card p {
    font-size: 14px;
}

/* Emoji animation */
.emoji {
    display: inline-block;
    animation: bounce 1.5s infinite;
}

@keyframes bounce {
    50% { transform: translateY(-5px); }
}

</style>
</head>

<body>

<header>
    <h1>Restaurant Management System <span class="emoji">🍽️</span></h1>

    <!-- 🌙 Toggle Button -->
    <button class="toggle-btn" onclick="toggleMode()">🌙</button>
</header>

<main>
    <a href="categories.php" class="card">
    <div class="icon">📂</div>        
    <h2>Categories</h2>
        <p>Manage food categories</p>
    </a>

    <a href="Restaurants.php" class="card">
     <div class="icon">🏪</div>
        <h2>Restaurants</h2>
        <p>View restaurants</p>
    </a>

    <a href="menu_items.php" class="card">
     <div class="icon">🍔</div>
        <h2>Menu Items</h2>
        <p>Manage menu</p>
    </a>

    <a href="customer.php" class="card">
    <div class="icon">👥</div>
        <h2>Customers</h2>
        <p>Customer details</p>
    </a>

    <a href="employees.php" class="card">
     <div class="icon">🧑‍🍳</div>
        <h2>Employees</h2>
        <p>Staff info</p>
    </a>
</main>

<script>
function toggleMode() {
    document.body.classList.toggle("dark");
}
</script>

</body>
</html>
